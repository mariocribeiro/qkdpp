[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qkdpp"
version = "0.1.0"
description = "Classical post-processing (sifting, parameter estimation, error correction, privacy amplification) for QKD experiments."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.20"]

[tool.setuptools.packages.find]
include = ["qkdpp*"]
